name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_GUIDE_PROFILE_EXTENSIONS_ENABLED: ${{ secrets.VITE_GUIDE_PROFILE_EXTENSIONS_ENABLED }}
      E2E_REQUIRE_AUTH: 'true'
      E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
      E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
      E2E_MDRRMO_EMAIL: ${{ secrets.E2E_MDRRMO_EMAIL }}
      E2E_MDRRMO_PASSWORD: ${{ secrets.E2E_MDRRMO_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_STOTOMAS_ADMIN_EMAIL: ${{ secrets.E2E_STOTOMAS_ADMIN_EMAIL }}
      E2E_STOTOMAS_ADMIN_PASSWORD: ${{ secrets.E2E_STOTOMAS_ADMIN_PASSWORD }}
      E2E_RANGER_EMAIL: ${{ secrets.E2E_RANGER_EMAIL }}
      E2E_RANGER_PASSWORD: ${{ secrets.E2E_RANGER_PASSWORD }}
      E2E_GUIDE_EMAIL: ${{ secrets.E2E_GUIDE_EMAIL }}
      E2E_GUIDE_PASSWORD: ${{ secrets.E2E_GUIDE_PASSWORD }}
      E2E_HIKER_EMAIL: ${{ secrets.E2E_HIKER_EMAIL }}
      E2E_HIKER_PASSWORD: ${{ secrets.E2E_HIKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npm run test:e2e:install
      - name: Run complete verification
        run: npm run verify
